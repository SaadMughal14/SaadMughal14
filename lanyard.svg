<svg width="320" height="480" viewBox="0 0 320 480" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="strapGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#3b82f6"/>
    <stop offset="100%" stop-color="#00d9ff"/>
  </linearGradient>
  <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#0a1628"/>
    <stop offset="100%" stop-color="#050b16"/>
  </linearGradient>
  <linearGradient id="avatarRing" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#3b82f6"/>
    <stop offset="100%" stop-color="#f5a623">
      <animate attributeName="stop-color" values="#f5a623;#00d9ff;#f5a623" dur="4s" repeatCount="indefinite"/>
    </stop>
  </linearGradient>
  <linearGradient id="shineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
    <stop offset="50%" stop-color="#fff" stop-opacity="0.35"/>
    <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="cardClip"><rect x="-90" y="0" width="180" height="230" rx="16"/></clipPath>
  <style>.mono{font-family:'Courier New',Consolas,monospace;} .sans{font-family:'Segoe UI',Helvetica,Arial,sans-serif;}</style>
</defs>

<!-- pivot group: swings the whole lanyard around the fixed anchor point -->
<g transform="translate(160,0)">
  <g>
    <animateTransform attributeName="transform" type="rotate"
      values="0;-1 160 0;9 160 0;-7 160 0;5 160 0;-3 160 0;2 160 0;-1 160 0;0 160 0"
      keyTimes="0;0.05;0.15;0.3;0.45;0.6;0.75;0.9;1"
      dur="6s" begin="0.2s" fill="freeze" calcMode="spline"
      keySplines="0.3 0 0.7 1;0.3 0 0.7 1;0.3 0 0.7 1;0.3 0 0.7 1;0.3 0 0.7 1;0.3 0 0.7 1;0.3 0 0.7 1;0.3 0 0.7 1"/>
    <animateTransform attributeName="transform" type="rotate" values="-1 160 0;1 160 0;-1 160 0" dur="3.4s" begin="6.2s" repeatCount="indefinite" additive="sum"/>

    <!-- strap, drops in -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0s" dur="0.3s" fill="freeze"/>
      <rect x="-14" y="-40" width="28" height="90" fill="url(#strapGrad)"/>
      <text x="0" y="10" text-anchor="middle" class="mono" font-size="9" fill="#fff" opacity="0.85" transform="rotate(0)">SAAD &#183; DEV</text>
      <circle cx="0" cy="52" r="9" fill="#cfe3ff" stroke="#7a8fa8" stroke-width="1.5"/>
      <circle cx="0" cy="52" r="4" fill="none" stroke="#050b16" stroke-width="1.5"/>
      <path d="M -3 60 A 3 8 0 0 0 3 60" fill="none" stroke="#7a8fa8" stroke-width="2"/>
    </g>

    <!-- card -->
    <g transform="translate(0,64)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.15s" dur="0.35s" fill="freeze"/>
      <rect x="-92" y="-2" width="184" height="234" rx="18" fill="rgba(0,0,0,0.25)"/>
      <rect x="-90" y="0" width="180" height="230" rx="16" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.12)"/>

      <g clip-path="url(#cardClip)">
        <rect x="-90" y="0" width="180" height="230" fill="rgba(0,217,255,0.03)"/>
        <!-- avatar -->
        <circle cx="0" cy="60" r="38" fill="none" stroke="url(#avatarRing)" stroke-width="3"/>
        <circle cx="0" cy="60" r="32" fill="#0e2036"/>
        <text x="0" y="72" text-anchor="middle" class="sans" font-size="30" font-weight="700" fill="#e3edff">SM</text>

        <text x="0" y="118" text-anchor="middle" class="sans" font-size="16" font-weight="700" fill="#ffffff">Saad Mughal</text>
        <text x="0" y="136" text-anchor="middle" class="mono" font-size="11" fill="#7db8ff">Full-Stack Engineer</text>
        <text x="0" y="150" text-anchor="middle" class="mono" font-size="11" fill="#7ec8ff">AI Systems Architect</text>

        <line x1="-70" y1="164" x2="70" y2="164" stroke="rgba(255,255,255,0.12)"/>

        <!-- barcode -->
        <g transform="translate(-64,176)" fill="#cfe3ff">
          <rect x="0" y="0" width="2" height="24"/><rect x="4" y="0" width="1" height="24"/><rect x="7" y="0" width="3" height="24"/>
          <rect x="12" y="0" width="1" height="24"/><rect x="15" y="0" width="2" height="24"/><rect x="19" y="0" width="1" height="24"/>
          <rect x="22" y="0" width="3" height="24"/><rect x="27" y="0" width="1" height="24"/><rect x="30" y="0" width="2" height="24"/>
          <rect x="34" y="0" width="1" height="24"/><rect x="37" y="0" width="3" height="24"/><rect x="42" y="0" width="1" height="24"/>
          <rect x="45" y="0" width="2" height="24"/><rect x="49" y="0" width="1" height="24"/><rect x="52" y="0" width="3" height="24"/>
          <rect x="57" y="0" width="1" height="24"/><rect x="60" y="0" width="2" height="24"/><rect x="64" y="0" width="1" height="24"/>
          <rect x="67" y="0" width="3" height="24"/><rect x="72" y="0" width="1" height="24"/><rect x="75" y="0" width="2" height="24"/>
          <rect x="79" y="0" width="1" height="24"/><rect x="82" y="0" width="3" height="24"/><rect x="87" y="0" width="1" height="24"/>
          <rect x="90" y="0" width="2" height="24"/><rect x="94" y="0" width="1" height="24"/><rect x="97" y="0" width="3" height="24"/>
          <rect x="102" y="0" width="1" height="24"/><rect x="105" y="0" width="2" height="24"/><rect x="109" y="0" width="1" height="24"/>
          <rect x="112" y="0" width="3" height="24"/><rect x="117" y="0" width="1" height="24"/><rect x="120" y="0" width="2" height="24"/>
          <rect x="124" y="0" width="1" height="24"/><rect x="127" y="0" width="3" height="24"/>
        </g>
        <text x="0" y="222" text-anchor="middle" class="mono" font-size="9" fill="#5c7a9c">GH &#183; SaadMughal14</text>

        <!-- holographic shine sweep -->
        <rect x="-160" y="0" width="60" height="230" fill="url(#shineGrad)" transform="skewX(-20)">
          <animate attributeName="x" values="-160;250" dur="3.5s" begin="1s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>
  </g>
</g>
</svg>
