<svg width="480" height="195" viewBox="0 0 480 195" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#3b82f6"/>
    <stop offset="100%" stop-color="#f5a623"/>
  </linearGradient>
  <style>
    .mono{font-family:'Courier New',Consolas,monospace;}
    .sans{font-family:'Segoe UI',Helvetica,Arial,sans-serif;}
    .label{fill:#cfe3ff;font-size:13px;}
    .val{fill:#ffffff;font-size:13px;font-weight:700;}
  </style>
</defs>

<rect x="0.5" y="0.5" width="479" height="194" rx="16" fill="#060a14" stroke="rgba(0,217,255,0.25)"/>
<text x="24" y="34" class="sans" font-size="17" font-weight="700" fill="#ffffff">Saad's GitHub Stats</text>

<!-- rank ring -->
<g transform="translate(80,118)">
  <circle r="52" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="10"/>
  <circle r="52" fill="none" stroke="url(#ringGrad)" stroke-width="10" stroke-linecap="round"
    stroke-dasharray="327" stroke-dashoffset="327" transform="rotate(-90)">
    <animate attributeName="stroke-dashoffset" from="327" to="55" dur="1.6s" begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1"/>
  </circle>
  <text text-anchor="middle" y="8" class="sans" font-size="26" font-weight="700" fill="#ffffff">A+</text>
</g>

<!-- stat rows, slide in from right -->
<g class="mono">
  <g transform="translate(180,58)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="0.4s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="220,58" to="180,58" begin="0.6s" dur="0.4s" fill="freeze"/>
    <text class="label" x="0" y="0">Total Stars Earned</text><text class="val" x="270" y="0">128</text>
  </g>
  <g transform="translate(180,86)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.75s" dur="0.4s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="220,86" to="180,86" begin="0.75s" dur="0.4s" fill="freeze"/>
    <text class="label" x="0" y="0">Total Commits</text><text class="val" x="270" y="0">1,940</text>
  </g>
  <g transform="translate(180,114)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="0.4s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="220,114" to="180,114" begin="0.9s" dur="0.4s" fill="freeze"/>
    <text class="label" x="0" y="0">Total PRs</text><text class="val" x="270" y="0">64</text>
  </g>
  <g transform="translate(180,142)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.05s" dur="0.4s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="220,142" to="180,142" begin="1.05s" dur="0.4s" fill="freeze"/>
    <text class="label" x="0" y="0">Total Issues</text><text class="val" x="270" y="0">37</text>
  </g>
  <g transform="translate(180,170)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.2s" dur="0.4s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="220,170" to="180,170" begin="1.2s" dur="0.4s" fill="freeze"/>
    <text class="label" x="0" y="0">Contributed to (last yr)</text><text class="val" x="270" y="0">22</text>
  </g>
</g>
</svg>
