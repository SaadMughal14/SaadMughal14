<svg width="320" height="230" viewBox="0 0 320 230" xmlns="http://www.w3.org/2000/svg">
<defs>
  <style>
    .sans{font-family:'Segoe UI',Helvetica,Arial,sans-serif;}
    .label{fill:#d8fff0;font-size:13px;}
    .pct{fill:#7a9c8e;font-size:12px;text-anchor:end;}
  </style>
</defs>
<rect x="0.5" y="0.5" width="319" height="229" rx="16" fill="#060a14" stroke="rgba(59,130,246,0.25)"/>
<text x="20" y="30" class="sans" font-size="16" font-weight="700" fill="#ffffff">Most Used Languages</text>

<g transform="translate(20,50)">
  <!-- TypeScript -->
  <text class="label" x="0" y="10">TypeScript</text><text class="pct" x="280" y="10">38%</text>
  <rect x="0" y="16" width="280" height="8" rx="4" fill="rgba(255,255,255,0.06)"/>
  <rect x="0" y="16" width="0" height="8" rx="4" fill="#3b82f6">
    <animate attributeName="width" from="0" to="106.4" begin="0.3s" dur="1s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1"/>
  </rect>

  <!-- JavaScript -->
  <text class="label" x="0" y="44">JavaScript</text><text class="pct" x="280" y="44">27%</text>
  <rect x="0" y="50" width="280" height="8" rx="4" fill="rgba(255,255,255,0.06)"/>
  <rect x="0" y="50" width="0" height="8" rx="4" fill="#f5a623">
    <animate attributeName="width" from="0" to="75.6" begin="0.5s" dur="1s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1"/>
  </rect>

  <!-- Python -->
  <text class="label" x="0" y="78">Python</text><text class="pct" x="280" y="78">18%</text>
  <rect x="0" y="84" width="280" height="8" rx="4" fill="rgba(255,255,255,0.06)"/>
  <rect x="0" y="84" width="0" height="8" rx="4" fill="#17e6c8">
    <animate attributeName="width" from="0" to="50.4" begin="0.7s" dur="1s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1"/>
  </rect>

  <!-- HTML -->
  <text class="label" x="0" y="112">HTML</text><text class="pct" x="280" y="112">11%</text>
  <rect x="0" y="118" width="280" height="8" rx="4" fill="rgba(255,255,255,0.06)"/>
  <rect x="0" y="118" width="0" height="8" rx="4" fill="#ff8a65">
    <animate attributeName="width" from="0" to="30.8" begin="0.9s" dur="1s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1"/>
  </rect>

  <!-- CSS -->
  <text class="label" x="0" y="146">CSS</text><text class="pct" x="280" y="146">6%</text>
  <rect x="0" y="152" width="280" height="8" rx="4" fill="rgba(255,255,255,0.06)"/>
  <rect x="0" y="152" width="0" height="8" rx="4" fill="#6366f1">
    <animate attributeName="width" from="0" to="16.8" begin="1.1s" dur="1s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1"/>
  </rect>
</g>
</svg>
