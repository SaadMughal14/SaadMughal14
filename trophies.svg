<svg width="560" height="330" viewBox="0 0 560 330" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="shine2" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
    <stop offset="50%" stop-color="#fff" stop-opacity="0.5"/>
    <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <style>
    .sans{font-family:'Segoe UI',Helvetica,Arial,sans-serif;}
    .t-title{fill:#b8f5e0;font-size:13px;}
    .t-rank{font-size:22px;font-weight:700;}
  </style>
</defs>
<rect width="560" height="330" rx="16" fill="#060a14"/>

<!-- row 1 -->
<g transform="translate(10,10)">
  <clipPath id="c0"><rect width="130" height="150" rx="14"/></clipPath>
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.1s" dur="0.35s" fill="freeze"/>
    <rect width="130" height="150" rx="14" fill="#0a1424" stroke="rgba(59,130,246,0.45)"/>
    <g clip-path="url(#c0)">
      <text x="65" y="44" text-anchor="middle" font-size="30">⭐</text>
      <text x="65" y="68" text-anchor="middle" class="sans t-title">Stars</text>
      <text x="65" y="98" text-anchor="middle" class="sans t-rank" fill="#3b82f6">A+</text>
      <text x="65" y="132" text-anchor="middle" class="sans" font-size="16" fill="#ffffff">128</text>
      <rect x="-60" y="0" width="40" height="150" fill="url(#shine2)" transform="skewX(-20)">
        <animate attributeName="x" values="-60;190" dur="3.2s" begin="1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</g>

